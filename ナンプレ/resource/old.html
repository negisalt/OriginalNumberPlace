<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x5 ミニナンプレ</title>
    <link rel="stylesheet" href="css/old.css"> 
</head>
<body>

    <h1>5×5 ミニナンプレ</h1>
    <p>縦・横の各列に1〜5の数字が1つずつ入るように埋めてください。</p>

    <div class="board" id="board"></div>

    <div class="controls">
        <button onclick="checkAnswer()">答え合わせ</button>
        <button onclick="initGame()">新しい盤面</button>

        <div class="seed-area">
            <p>シード値入力<input type="text" id="seedInput" maxlength="8" placeholder="8桁の英数字"></p>
            <button onclick="generateBySeed()">生成</button>
        </div>
        

        <h2>ーーー</h2>
        <div id="message"></div>
    </div>

    <script src="js/old.js"></script>
</body>
</html>
