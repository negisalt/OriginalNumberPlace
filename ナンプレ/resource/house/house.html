<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>◆◆My Personal Room◆◆</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="base">
      <!-- 左：サイドバー -->
      <div class="left">
            <iframe src="menu.html" width="100%" height="100%" name="left_frame"></iframe>
      </div>
      
      <!-- 右：メインコンテンツ -->
      <div class="right" name="right_frame">
         <marquee scrollamount="5" width="80%">
            <h1>～～ようこそリリィの部屋へ～～</h1>
         </marquee>
         
         <div style="margin: 30px auto; border: 1px double #999; width: fit-content; padding: 10px; background-color: #fff;">
            あなたは<b> 0000 </b>番目の来訪者です！<br>
            <span style="font-size: 10px;">（キリ番踏んだら掲示板に報告してね！）</span>
         </div>

         <canvas id="backgroundCanvas" width="800" height="600" style="position: absolute; top: 0; left: 0; z-index: -1;"></canvas>

         <div style="margin: 30px auto; border: 1px double #999; width: fit-content; padding: 50px; background-color: #fff;">
            <h1>現在 大工事中！！</h1>
            <p>ただいまサイトの作成中です。<br>
               いくつかのコンテンツが表示されないです。<br>
               ご迷惑をおかけしますが、ご了承ください。</p>
         </div>

         <!-- アシスタントダイアログ (絶対配置・アイコンスペース付き) -->
         <div id="assistant-window" class="win95-window" style="top: 400px; left: 500px;">
            <div class="win95-titlebar">
               <span class="win95-title">Assistant - Conversation</span>
               <div class="win95-close">×</div>
            </div>
            <div class="win95-content">
               <div class="dialogue-body">
                  <div class="dialogue-icon-container">
                     <div id="dialogue-icon" class="dialogue-icon-placeholder">
                        <!-- アイコン画像がここに入ります -->
                        ？
                     </div>
                  </div>
                  <div class="dialogue-main-text">
                     <div class="dialogue-name" id="dialogue-name">リリィ</div>
                     <div class="dialogue-text" id="dialogue-text">
                        ……あ、……こんにちは！<br>
                        よくここまで辿り着きましたね。
                     </div>
                  </div>
               </div>
               <div class="dialogue-footer">
                  <button class="win95-button" onclick="nextDialogue()">次へ ＞</button>
               </div>
            </div>
         </div>

         <p style="margin-top: 200px; font-size: 12px;">
            このサイトは 800x600 以上の解像度で<br>
            Internet Explorer 5.0 以上を推奨しています。
         </p>
      </div>
   </div>
   <script src="script.js"></script>
</body>
</html>
